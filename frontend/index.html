<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LLM Compatibility Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>LLM Compatibility Checker</h1>
    <section id="hardware">
        <h2>Detected Hardware</h2>
        <div id="hardware-info">Loading hardware info...</div>
    </section>
    <section id="check">
        <h2>Check LLM Compatibility</h2>
        <label for="llm-select">Select LLM:</label>
    <input type="text" id="model-search" placeholder="Search models..." style="margin-left:10px;">
    <br>
        <select id="llm-select">
            <option value="" disabled selected>Select a model</option>
        </select>
        <button id="check-btn">Check Compatibility</button>
        <pre id="result">Result will appear here.</pre>
    </section>
    <script src="script.js"></script>
    <section id="models">
        <h2>Compatible Models</h2>
        <button id="load-models-btn">Load Compatible Models</button>
        <pre id="models-list">Models will appear here.</pre>
    </section>
</body>
</html>
